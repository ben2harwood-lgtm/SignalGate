name: SignalGate Official MetaEditor Compile

on:
  pull_request:
    paths:
      - "mt5_ea/**"
      - "scripts/capture_mt5_compile_evidence.ps1"
      - "scripts/Run-MT5-Compile-Acceptance.bat"
      - "docs/MT5_ACCEPTANCE.md"
      - "docs/evidence/MT5_ACCEPTANCE_RECEIPT_TEMPLATE.md"
      - ".github/workflows/mt5-official-compile.yml"
  push:
    branches:
      - main
    paths:
      - "mt5_ea/**"
      - "scripts/capture_mt5_compile_evidence.ps1"
      - "scripts/Run-MT5-Compile-Acceptance.bat"
      - "docs/MT5_ACCEPTANCE.md"
      - ".github/workflows/mt5-official-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalgate-mt5-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metaeditor-compile:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      METAQUOTES_INSTALLER_URL: https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind evidence to checked-out source
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve checked-out Git SHA."
          }
          $ea = Join-Path $env:GITHUB_WORKSPACE "mt5_ea\SignalGateEA.mq5"
          if (-not (Test-Path -LiteralPath $ea)) { throw "EA source missing." }
          $sourceHash = (Get-FileHash -LiteralPath $ea -Algorithm SHA256).Hash.ToLowerInvariant()

          "SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EA_SOURCE=$ea" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EA_SOURCE_SHA256=$sourceHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Git source SHA: $sourceSha"
          Write-Host "EA SHA-256: $sourceHash"

      - name: Download official MetaQuotes installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri $env:METAQUOTES_INSTALLER_URL -OutFile $installer
          if (-not (Test-Path -LiteralPath $installer)) { throw "MetaTrader installer download failed." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "MT5_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Official installer SHA-256: $hash"

      - name: Install MetaTrader 5 in automatic mode
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "MetaTrader5"
          $args = @("/auto", ('/path:"{0}"' -f $install))
          $process = Start-Process -FilePath $env:MT5_INSTALLER -ArgumentList $args -Wait -PassThru
          Write-Host "Installer exit code: $($process.ExitCode)"

          $deadline = (Get-Date).AddMinutes(3)
          $metaeditor = Join-Path $install "metaeditor64.exe"
          while (-not (Test-Path -LiteralPath $metaeditor) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path -LiteralPath $metaeditor)) {
            throw "metaeditor64.exe was not installed at the requested path."
          }

          $terminal = Join-Path $install "terminal64.exe"
          "METAEDITOR_PATH=$metaeditor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TERMINAL_PATH=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_EXIT_CODE=$($process.ExitCode)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $editorVersion = (Get-Item -LiteralPath $metaeditor).VersionInfo.FileVersion
          "METAEDITOR_VERSION=$editorVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath $terminal) {
            $terminalVersion = (Get-Item -LiteralPath $terminal).VersionInfo.FileVersion
            "TERMINAL_VERSION=$terminalVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Host "MetaEditor version: $editorVersion"

      - name: Initialize MQL5 Standard Library
        shell: pwsh
        run: |
          $install = Split-Path -Parent $env:METAEDITOR_PATH
          $portableMql5 = Join-Path $install "MQL5"
          $portableTrade = Join-Path $portableMql5 "Include\Trade\Trade.mqh"

          if (-not (Test-Path -LiteralPath $portableTrade) -and (Test-Path -LiteralPath $env:TERMINAL_PATH)) {
            Write-Host "Standard Library not present yet; starting terminal briefly in portable mode."
            $terminalProcess = Start-Process -FilePath $env:TERMINAL_PATH -ArgumentList "/portable" -PassThru
            Start-Sleep -Seconds 12
            if (-not $terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Test-Path -LiteralPath $portableTrade)) {
            Write-Host "Portable Standard Library still absent; starting MetaEditor briefly in portable mode."
            $editorProcess = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList "/portable" -PassThru
            Start-Sleep -Seconds 8
            if (-not $editorProcess.HasExited) {
              Stop-Process -Id $editorProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $candidateRoots = @()
          if (Test-Path -LiteralPath $portableTrade) {
            $candidateRoots += $portableMql5
          }

          $dataRoot = Join-Path $env:APPDATA "MetaQuotes\Terminal"
          if (Test-Path -LiteralPath $dataRoot) {
            $candidateRoots += @(
              Get-ChildItem -LiteralPath $dataRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $mql5 = Join-Path $_.FullName "MQL5"
                  $trade = Join-Path $mql5 "Include\Trade\Trade.mqh"
                  if (Test-Path -LiteralPath $trade) { $mql5 }
                }
            )
          }

          $candidateRoots = @($candidateRoots | Sort-Object -Unique)
          if ($candidateRoots.Count -eq 0) {
            throw "MetaTrader installed, but the MQL5 Standard Library (Include\Trade\Trade.mqh) was not initialized."
          }

          if ($candidateRoots -contains $portableMql5) {
            $mql5Root = $portableMql5
            $portable = "true"
          } elseif ($candidateRoots.Count -eq 1) {
            $mql5Root = $candidateRoots[0]
            $portable = "false"
          } else {
            $details = $candidateRoots -join [Environment]::NewLine
            throw "Multiple MQL5 roots found after initialization; refusing to guess:$([Environment]::NewLine)$details"
          }

          "MQL5_ROOT=$mql5Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "METAEDITOR_PORTABLE=$portable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MQL5 root: $mql5Root"
          Write-Host "Portable compile mode: $portable"

      - name: Compile source under test with official MetaEditor
        shell: pwsh
        run: |
          $ea = $env:EA_SOURCE
          $log = [System.IO.Path]::ChangeExtension($ea, ".log")
          $evidence = Join-Path $env:RUNNER_TEMP "mt5-compile-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item -LiteralPath $ea -Destination (Join-Path $evidence "SignalGateEA.mq5") -Force

          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }

          $args = @(
            ('/compile:"{0}"' -f $ea),
            ('/include:"{0}"' -f $env:MQL5_ROOT),
            '/log'
          )
          if ($env:METAEDITOR_PORTABLE -eq "true") {
            $args += "/portable"
          }

          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $args -Wait -PassThru -NoNewWindow

          $errors = -1
          $warnings = -1
          $resultValue = "ERROR"
          $logFound = Test-Path -LiteralPath $log
          if ($logFound) {
            Copy-Item -LiteralPath $log -Destination (Join-Path $evidence "SignalGateEA.log") -Force
            $text = Get-Content -LiteralPath $log -Raw
            Write-Host $text
            $matches = [regex]::Matches($text, '(?im)result\s*:?\s*(\d+)\s+errors?,\s+(\d+)\s+warnings?')
            if ($matches.Count -ge 1) {
              $last = $matches[$matches.Count - 1]
              $errors = [int]$last.Groups[1].Value
              $warnings = [int]$last.Groups[2].Value
              $resultValue = $(if ($errors -eq 0 -and $warnings -eq 0) { "PASS" } else { "FAIL" })
            }
          }

          $receipt = [ordered]@{
            schema = "signalgate-official-metaeditor-ci-v1"
            source_git_sha = $env:SOURCE_SHA
            ea_source_sha256 = $env:EA_SOURCE_SHA256
            metaquotes_installer_url = $env:METAQUOTES_INSTALLER_URL
            metaquotes_installer_sha256 = $env:MT5_INSTALLER_SHA256
            installer_exit_code = $env:INSTALLER_EXIT_CODE
            metaeditor_version = $env:METAEDITOR_VERSION
            terminal_version = $env:TERMINAL_VERSION
            mql5_root = $env:MQL5_ROOT
            portable_mode = $env:METAEDITOR_PORTABLE
            compiler_process_exit = $process.ExitCode
            compile_log_found = $logFound
            compile_errors = $errors
            compile_warnings = $warnings
            result = $resultValue
            github_run_id = $env:GITHUB_RUN_ID
            github_sha = $env:GITHUB_SHA
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence "receipt.json") -Encoding UTF8

          if (-not $logFound) {
            throw "MetaEditor did not create a compiler log."
          }
          if ($errors -lt 0 -or $warnings -lt 0) {
            throw "No final MetaEditor result line found in compiler log."
          }
          if ($errors -ne 0 -or $warnings -ne 0) {
            throw "Official MetaEditor compile failed acceptance: $errors errors, $warnings warnings."
          }

      - name: Upload MetaEditor compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalgate-metaeditor-compile-${{ github.run_id }}
          path: ${{ runner.temp }}\mt5-compile-evidence
          if-no-files-found: error
          retention-days: 30
