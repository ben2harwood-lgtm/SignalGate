name: SignalGate CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/signalgate-hardening-2026-09-18

permissions:
  contents: read

concurrency:
  group: signalgate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-hosted.txt
            telegram_bot/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q -rx --xfail-tb
      - name: Exact-commit broker-free rehearsal (not broker acceptance)
        run: |
          python scripts/run_broker_free_rehearsal.py \
            --candidate-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/signalgate-rehearsal"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'signalgate-rehearsal/receipt.json'; r=json.loads(p.read_text()); assert r['result']=='REHEARSAL_PASS'; assert r['actual_mt5_demo_acceptance']=='OPEN'; assert not r['broker_connected'] and not r['orders_placed']; assert all(x['real_broker_result']=='NOT_RUN' for x in r['scenarios'])"
      - name: Compile Python sources
        run: python -m compileall -q backend telegram_bot simulator scripts

  telegram-bot-offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram_bot/requirements.txt
      - name: Install isolated Telegram bot dependencies
        run: python -m pip install --upgrade pip && pip install -r telegram_bot/requirements.txt
      - name: Check hosted Telegram command/approval/screenshot wiring offline
        run: python scripts/verify_telegram_bot_wiring.py

  postgres-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: signalgate_tests
          POSTGRES_USER: signalgate
          POSTGRES_PASSWORD: signalgate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalgate -d signalgate_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNALGATE_TEST_DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate_tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-hosted.txt
      - name: Install hosted backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-hosted.txt
      # The full three-test pause/claim module passed in a single pytest
      # process at 03db21e9, while the mandatory full PostgreSQL suite
      # still stalled. Probe it with its THREE immediately preceding
      # PostgreSQL lock/race modules in normal file order to test whether
      # preceding PG test fixtures cause cross-module lock/session leakage.
      # Strict XFAIL/XPASS and the unfiltered full suite remain mandatory.
      - name: Probe preceding PostgreSQL locks plus pause/claim trio
        working-directory: backend
        run: |
          timeout --signal=TERM --kill-after=10s 120s \
            python -m pytest -vv -rx --xfail-tb \
              -o faulthandler_timeout=20 \
              tests/test_postgresql_admin_pause_pending_claim_commit_race.py \
              tests/test_postgresql_admin_pause_setting_lock_contract.py \
              tests/test_postgresql_pause_lock_mode_contract.py \
              tests/test_postgresql_postapproval_feed_pause_pending_claim_race.py
      - name: Run full backend suite on PostgreSQL
        working-directory: backend
        # Keep the entire mandatory suite and existing 15-minute job cap.
        # Bound pytest itself at five minutes so even if GitHub's redirected
        # job-log blob is missing, an always-uploaded short-lived artifact
        # retains the last named test and any native 45-second traceback.
        # Avoid tee in the timeout pipeline: detached descendants can keep
        # the pipe open after pytest is killed, preventing the step from ending
        # and blocking the always-uploaded diagnostic artifact.
        # Capture to a finite file, print it, and preserve the exact exit status.
        run: |
          pytest_exit=0
          timeout --signal=TERM --kill-after=10s 5m \
            python -m pytest -vv -rx --xfail-tb \
              -o faulthandler_timeout=45 -o faulthandler_exit_on_timeout=true \
            > pg-pytest-full.log 2>&1 || pytest_exit=$?
          cat pg-pytest-full.log
          exit "$pytest_exit"
      - name: Preserve PostgreSQL diagnostic output on failure or success
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backend-pytest-full
          path: backend/pg-pytest-full.log
          if-no-files-found: warn
          retention-days: 2

  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      - name: Scan application code for medium/high security findings
        run: bandit -q -r backend/app telegram_bot simulator scripts -x backend/tests -ll

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Audit hosted dependencies
        run: pip-audit -r backend/requirements-hosted.txt
      - name: Audit Telegram bot dependencies
        run: pip-audit -r telegram_bot/requirements.txt

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: signalgate
          POSTGRES_USER: signalgate
          POSTGRES_PASSWORD: signalgate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalgate -d signalgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-hosted.txt
      - name: Install hosted dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-hosted.txt
      - name: Upgrade empty PostgreSQL to head
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Prove ORM and migration schema agree
        working-directory: backend
        run: alembic -c alembic.ini check
      - name: Prove hosted startup accepts current schema
        working-directory: backend
        run: python -c "from app.database import _assert_hosted_schema_current; _assert_hosted_schema_current()"
      - name: Prove customer licence migration erases legacy plaintext
        working-directory: backend
        run: |
          alembic -c alembic.ini downgrade 20260919_0006
          python - <<'PY'
          import hashlib
          import os
          import psycopg2

          raw = "SG-ABCD-EFGH-JKLM"
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn, conn.cursor() as cur:
                  cur.execute(
                      """
                      INSERT INTO users
                        (id, telegram_user_id, status, fixed_lot_size, license_key,
                         created_at, updated_at)
                      VALUES
                        ('USER-LEGACY-CI', 'legacy-ci', 'ACTIVE', 0.01, %s, NOW(), NOW())
                      """,
                      (raw,),
                  )
          finally:
              conn.close()
          print("legacy plaintext row inserted at 0006")
          PY
          alembic -c alembic.ini upgrade head
          python - <<'PY'
          import hashlib
          import os
          import psycopg2

          raw = "SG-ABCD-EFGH-JKLM"
          expected = hashlib.sha256(raw.encode("utf-8")).hexdigest()
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn, conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT license_key, license_key_hash, license_key_last4
                      FROM users WHERE id='USER-LEGACY-CI'
                      """
                  )
                  legacy, digest, last4 = cur.fetchone()
                  assert legacy is None, "legacy plaintext licence survived migration"
                  assert digest == expected
                  assert last4 == raw[-4:]
          finally:
              conn.close()
          print("legacy plaintext erased and hash backfill verified")
          PY
          alembic -c alembic.ini check
      - name: Prove audit-chain migration backfills historical rows
        working-directory: backend
        run: |
          alembic -c alembic.ini downgrade 20260919_0009
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn, conn.cursor() as cur:
                  cur.execute(
                      """
                      INSERT INTO audit_logs
                        (id, event_type, entity_type, entity_id, payload_json, created_at)
                      VALUES
                        ('AUD-CI-1', 'CI_FIRST', 'ci', '1', '{"order":1}', '2026-09-19 00:00:00.000001'),
                        ('AUD-CI-2', 'CI_SECOND', 'ci', '2', '{"order":2}', '2026-09-19 00:00:00.000002')
                      """
                  )
          finally:
              conn.close()
          print("pre-chain audit rows inserted at 0009")
          PY
          alembic -c alembic.ini upgrade head
          python scripts_verify_audit_chain.py
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn, conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT id, prev_hash, record_hash
                      FROM audit_logs
                      WHERE id IN ('AUD-CI-1','AUD-CI-2')
                      ORDER BY created_at ASC, id ASC
                      """
                  )
                  rows = cur.fetchall()
                  assert len(rows) == 2
                  assert rows[0][1] is None
                  assert rows[0][2] and len(rows[0][2]) == 64
                  assert rows[1][1] == rows[0][2]
                  assert rows[1][2] and len(rows[1][2]) == 64
          finally:
              conn.close()
          print("audit hash-chain backfill verified")
          PY
          alembic -c alembic.ini check
      - name: Prove populated 0010 to 0011 PostgreSQL source epoch migration
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from urllib.parse import urlparse
          import psycopg2

          url = os.environ["DATABASE_URL"]
          target = urlparse(url)
          assert os.environ.get("CI") == "true"
          assert (target.scheme, target.hostname, target.path) == (
              "postgresql", "127.0.0.1", "/signalgate"
          ), "Only the disposable GitHub CI PostgreSQL database is allowed"

          def migrate(*args):
              subprocess.run(["alembic", "-c", "alembic.ini", *args], check=True)

          def query(sql):
              with psycopg2.connect(url) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(sql)
                      return cursor.fetchall()

          base_columns = (
              "id, provider_id, feed_id, status, source_type, external_identity"
          )
          target_rows = (
              "FROM provider_source_bindings "
              "WHERE id LIKE 'BND-CI-EPOCH-%' ORDER BY id"
          )
          migrate("downgrade", "20260919_0010")
          assert query("SELECT version_num FROM alembic_version") == [
              ("20260919_0010",)
          ]
          assert not query(
              "SELECT column_name FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          )

          with psycopg2.connect(url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "INSERT INTO organizations "
                      "(id, name, slug, status, created_at, updated_at) "
                      "VALUES ('ORG-CI-EPOCH', 'Synthetic Epoch Org', "
                      "'ci-epoch', 'ACTIVE', NOW(), NOW())"
                  )
                  cursor.execute(
                      "INSERT INTO providers "
                      "(id, organization_id, name, slug, status, paused, "
                      "created_at, updated_at) VALUES "
                      "('PRV-CI-EPOCH', 'ORG-CI-EPOCH', 'Synthetic Provider', "
                      "'ci-epoch', 'ACTIVE', TRUE, NOW(), NOW())"
                  )
                  cursor.execute(
                      "INSERT INTO feeds "
                      "(id, provider_id, name, source_namespace, status, paused, "
                      "created_at, updated_at) VALUES "
                      "('FED-CI-EPOCH', 'PRV-CI-EPOCH', 'Synthetic Feed', "
                      "'CI-EPOCH', 'ACTIVE', TRUE, NOW(), NOW())"
                  )
                  cursor.execute(
                      "INSERT INTO provider_source_bindings "
                      "(id, provider_id, feed_id, source_type, external_identity, "
                      "status, created_at, updated_at) VALUES "
                      "('BND-CI-EPOCH-1', 'PRV-LEGACY', 'FED-LEGACY', "
                      "'TELEGRAM', 'ci-epoch-10001', 'ACTIVE', NOW(), NOW()), "
                      "('BND-CI-EPOCH-2', 'PRV-CI-EPOCH', 'FED-CI-EPOCH', "
                      "'TELEGRAM', 'ci-epoch-20002', 'REVOKED', NOW(), NOW())"
                  )
          before = query(f"SELECT {base_columns} {target_rows}")
          assert len(before) == 2 and before[0][1] != before[1][1]
          # Fail midway through the *real* 0010 public-schema migration.
          # This disposable CI-only test must not use TEMP shadow tables.
          import importlib.util
          from pathlib import Path
          from types import SimpleNamespace
          import sqlalchemy as sa
          from alembic.operations import Operations
          from alembic.runtime.migration import MigrationContext

          revision_path = Path(
              "migrations/versions/20261101_0011_source_authorization_epoch.py"
          ).resolve()
          spec = importlib.util.spec_from_file_location(
              "ci_full_schema_epoch_interruption", revision_path
          )
          assert spec is not None and spec.loader is not None
          revision = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(revision)
          calls = [0]

          def interrupted_epoch(size):
              assert size == 16
              calls[0] += 1
              if calls[0] == 2:
                  raise RuntimeError("synthetic full-schema 0011 interruption")
              return "0" * 31 + "1"

          revision.secrets = SimpleNamespace(token_hex=interrupted_epoch)
          # Hosted CI includes psycopg2, not the newer psycopg DBAPI.
          engine = sa.create_engine(url.replace("postgresql://", "postgresql+psycopg2://", 1))
          try:
              try:
                  with engine.begin() as connection:
                      revision.op = Operations(MigrationContext.configure(connection))
                      revision.upgrade()
              except RuntimeError as exc:
                  assert str(exc) == "synthetic full-schema 0011 interruption"
              else:
                  raise AssertionError("Full-schema interruption was not reached")
          finally:
              engine.dispose()
          assert calls[0] == 2, "Failure must follow the first database UPDATE"
          assert query("SELECT version_num FROM alembic_version") == [
              ("20260919_0010",)
          ]
          assert query(f"SELECT {base_columns} {target_rows}") == before
          assert not query(
              "SELECT column_name FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          ), "Failed 0011 migration left a partial schema"
          print("PASS: canonical 0010 full-schema interrupted DDL/backfill rolled back")

          # A clean Alembic retry on the same populated database must succeed.
          migrate("upgrade", "head")
          after = query(
              f"SELECT {base_columns}, authorization_epoch {target_rows}"
          )
          assert [row[:6] for row in after] == before
          epochs = [row[6] for row in after]
          assert all(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{32}", value)
                     for value in epochs)
          assert len(set(epochs)) == 2
          assert query(
              "SELECT is_nullable FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          ) == [("NO",)]
          constraints = dict(query(
              "SELECT contype, count(*) FROM pg_constraint "
              "WHERE conrelid='public.provider_source_bindings'::regclass "
              "GROUP BY contype"
          ))
          assert constraints["f"] == 2 and constraints["u"] == 1
          assert query(
              "SELECT count(*) FROM pg_indexes WHERE schemaname='public' "
              "AND tablename='provider_source_bindings' AND indexname IN "
              "('ix_provider_source_bindings_provider_id', "
              "'ix_provider_source_bindings_feed_id', "
              "'ix_provider_source_bindings_external_identity')"
          ) == [(3,)]

          migrate("downgrade", "20260919_0010")
          assert query(f"SELECT {base_columns} {target_rows}") == before
          assert not query(
              "SELECT column_name FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          )
          migrate("upgrade", "head")
          retried = query(
              f"SELECT {base_columns}, authorization_epoch {target_rows}"
          )
          assert [row[:6] for row in retried] == before
          assert all(re.fullmatch(r"[0-9a-f]{32}", row[6]) for row in retried)
          assert all(retried[i][6] != epochs[i] for i in range(2))
          print("PASS: populated canonical 0010→0011→0010→0011; "
                "synthetic scopes/data, non-null epochs, FK/index preservation")
          PY
      - name: Prove PostgreSQL 0011 migration lock timeout and clean retry
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import time
          from urllib.parse import urlparse

          import psycopg2

          url = os.environ["DATABASE_URL"]
          target = urlparse(url)
          assert os.environ.get("CI") == "true"
          assert (target.scheme, target.hostname, target.path) == (
              "postgresql", "127.0.0.1", "/signalgate"
          ), "Refuse migration testing outside the disposable loopback CI database"

          def migrate(*args, env=None):
              return subprocess.run(
                  ["alembic", "-c", "alembic.ini", *args],
                  check=env is None, env=env, capture_output=env is not None,
                  text=env is not None, timeout=20,
              )

          def query(sql):
              with psycopg2.connect(url) as db:
                  with db.cursor() as cur:
                      cur.execute(sql)
                      return cur.fetchall()

          rows_sql = (
              "SELECT id, provider_id, feed_id, status "
              "FROM provider_source_bindings "
              "WHERE id LIKE 'BND-CI-EPOCH-%' ORDER BY id"
          )
          migrate("downgrade", "20260919_0010")
          original = query(rows_sql)
          assert len(original) == 2 and original[0][1] != original[1][1]
          assert query("SELECT version_num FROM alembic_version") == [
              ("20260919_0010",)
          ]
          assert query(
              "SELECT column_name FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          ) == []

          # An ordinary reader holds ACCESS SHARE until transaction end.
          # PostgreSQL ADD COLUMN requires ACCESS EXCLUSIVE: the migration
          # must time out cleanly rather than silently yielding a partial schema.
          holder = psycopg2.connect(url)
          try:
              with holder.cursor() as cur:
                  cur.execute(
                      "SELECT id FROM provider_source_bindings "
                      "WHERE id LIKE 'BND-CI-EPOCH-%'"
                  )
                  assert len(cur.fetchall()) == 2
              limited = dict(
                  os.environ,
                  PGOPTIONS="-c lock_timeout=500ms -c statement_timeout=5000ms",
              )
              started = time.monotonic()
              attempt = migrate("upgrade", "head", env=limited)
              elapsed = time.monotonic() - started
              log = (attempt.stdout + attempt.stderr).lower()
              assert attempt.returncode != 0, "Contended migration unexpectedly succeeded"
              assert "lock timeout" in log, (
                  "Migration failed for a reason other than PostgreSQL lock timeout: "
                  + log[-1800:]
              )
              assert elapsed < 15, "Lock timeout did not bound migration wait"
          finally:
              holder.rollback()
              holder.close()

          assert query("SELECT version_num FROM alembic_version") == [
              ("20260919_0010",)
          ], "Failed DDL advanced the Alembic revision"
          assert query(rows_sql) == original, "Failed DDL changed synthetic tenant data"
          assert not query(
              "SELECT column_name FROM information_schema.columns "
              "WHERE table_schema='public' AND table_name='provider_source_bindings' "
              "AND column_name='authorization_epoch'"
          ), "Lock timeout left a partial migration"

          migrate("upgrade", "head")
          migrated = query(
              "SELECT id, provider_id, feed_id, status, authorization_epoch "
              "FROM provider_source_bindings "
              "WHERE id LIKE 'BND-CI-EPOCH-%' ORDER BY id"
          )
          assert [row[:4] for row in migrated] == original
          epochs = [row[4] for row in migrated]
          assert len(set(epochs)) == 2
          assert all(
              isinstance(epoch, str) and re.fullmatch(r"[0-9a-f]{32}", epoch)
              for epoch in epochs
          )
          assert query("SELECT version_num FROM alembic_version") == [
              ("20261101_0011",)
          ]
          print(
              f"PASS: PostgreSQL 0011 lock timeout in {elapsed:.2f}s; "
              "rollback preserved tenants/schema; clean retry migrated source epochs"
          )
          PY
      - name: Prove populated PostgreSQL 0011 epoch rotation at synthetic volume
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import time
          from urllib.parse import urlparse

          import psycopg2

          url = os.environ["DATABASE_URL"]
          target = urlparse(url)
          assert os.environ.get("CI") == "true"
          assert (target.scheme, target.hostname, target.path) == (
              "postgresql", "127.0.0.1", "/signalgate"
          ), "Refuse volume test outside the disposable loopback CI database"

          def migrate(*args):
              subprocess.run(
                  ["alembic", "-c", "alembic.ini", *args],
                  check=True, timeout=120,
              )

          def query(sql):
              with psycopg2.connect(url) as db:
                  with db.cursor() as cur:
                      cur.execute(sql)
                      return cur.fetchall()

          original_sql = (
              "SELECT id, provider_id, feed_id, status "
              "FROM provider_source_bindings "
              "WHERE id LIKE 'BND-CI-VOLUME-%' ORDER BY id"
          )
          migrated_sql = original_sql.replace(
              "status FROM", "status, authorization_epoch FROM"
          )
          migrate("downgrade", "20260919_0010")
          assert query("SELECT version_num FROM alembic_version") == [
              ("20260919_0010",)
          ]
          assert query(original_sql) == []
          # The provider/feed were created earlier in this same isolated CI job.
          # Never generate production identifiers or use a network/broker.
          with psycopg2.connect(url) as db:
              with db.cursor() as cur:
                  cur.execute(
                      "INSERT INTO provider_source_bindings "
                      "(id, provider_id, feed_id, source_type, external_identity, "
                      "status, created_at, updated_at) "
                      "SELECT 'BND-CI-VOLUME-' || lpad(n::text, 5, '0'), "
                      "'PRV-CI-EPOCH', 'FED-CI-EPOCH', 'TELEGRAM', "
                      "'ci-volume-' || n::text, 'ACTIVE', NOW(), NOW() "
                      "FROM generate_series(1, 1200) AS n"
                  )
          original = query(original_sql)
          assert len(original) == 1200
          assert all(row[1:4] == (
              "PRV-CI-EPOCH", "FED-CI-EPOCH", "ACTIVE"
          ) for row in original)

          began = time.monotonic()
          migrate("upgrade", "head")
          first_seconds = time.monotonic() - began
          first = query(migrated_sql)
          assert [row[:4] for row in first] == original
          epochs = [row[4] for row in first]
          assert len(set(epochs)) == len(original), "Epoch collision in fixture"
          assert all(
              isinstance(epoch, str) and re.fullmatch(r"[0-9a-f]{32}", epoch)
              for epoch in epochs
          )
          assert query("SELECT version_num FROM alembic_version") == [
              ("20261101_0011",)
          ]
          migrate("downgrade", "20260919_0010")
          assert query(original_sql) == original
          began = time.monotonic()
          migrate("upgrade", "head")
          second_seconds = time.monotonic() - began
          second = query(migrated_sql)
          assert [row[:4] for row in second] == original
          assert len({row[4] for row in second}) == len(original)
          assert all(
              isinstance(row[4], str)
              and re.fullmatch(r"[0-9a-f]{32}", row[4])
              and row[4] != first[index][4]
              for index, row in enumerate(second)
          )
          print(
              "PASS: 1200 synthetic bindings retained tenant ownership, "
              "status and distinct rotating epochs across full-schema "
              f"PostgreSQL 0010→0011→0010→0011; "
              f"upgrade timings {first_seconds:.2f}s/{second_seconds:.2f}s "
              "(CI fixture, NOT production migration budget)"
          )
          PY
      - name: Verify historical baseline shape
        run: |
          cd backend
          alembic -c alembic.ini downgrade 20260918_0001
          cd ..
          python scripts/verify_migration_baseline.py
          cd backend
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
      - name: Prove downgrade is rejected, then re-upgrade
        working-directory: backend
        run: |
          alembic -c alembic.ini downgrade base
          python - <<'PY'
          from app.database import _assert_hosted_schema_current
          try:
              _assert_hosted_schema_current()
          except RuntimeError as exc:
              print(f"stale schema correctly rejected: {exc}")
          else:
              raise SystemExit("stale schema was incorrectly accepted")
          PY
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
          python -c "from app.database import _assert_hosted_schema_current; _assert_hosted_schema_current()"


  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build hosted image
        run: docker build --pull -t signalgate-ci .
      - name: Refuse local-auth startup in the actual hosted image (offline)
        run: |
          # Use no network and an unreachable synthetic DB URL. The guard must
          # exit before starting Uvicorn or attempting any database connection.
          exit_code=0
          output="$(timeout 10s docker run --rm --network none \
            -e REQUIRE_LICENSE=false \
            -e DEMO_ONLY_MODE=true \
            -e DATABASE_URL=postgresql://synthetic:synthetic@invalid.invalid/demo \
            signalgate-ci 2>&1)" || exit_code=$?
          if [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 124 ]; then
            echo "Unsafe hosted image unexpectedly launched or timed out" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Fq 'requires REQUIRE_LICENSE=true'

  backup-restore-smoke:
    # Keep PostgreSQL backup/restore clients matched to the v16 test server.
    # Rolling ubuntu-latest installed a v18 client that generated an incompatible dump.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalgate
          POSTGRES_USER: signalgate
          POSTGRES_PASSWORD: signalgate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalgate -d signalgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate
      PGPASSWORD: signalgate_ci_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-hosted.txt
      - name: Install matching PostgreSQL 16 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify matching PostgreSQL backup/restore client major
        run: |
          pg_dump --version | grep -Eq 'PostgreSQL\) 16\.'
          pg_restore --version | grep -Eq 'PostgreSQL\) 16\.'
      - name: Generate ephemeral backup encryption identity
        run: |
          age-keygen -o "$RUNNER_TEMP/backup-age-key.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/backup-age-key.txt")"
          test -n "$recipient"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_IDENTITY_FILE=$RUNNER_TEMP/backup-age-key.txt" >> "$GITHUB_ENV"
      - name: Install hosted dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-hosted.txt
      - name: Initialise source database at migration head
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Insert restore sentinel
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO settings (id, key, value, updated_at) VALUES ('SETTING-CI-RESTORE', 'restore_probe', 'survived', NOW());"
      - name: Create checked backup
        run: |
          output="$(bash scripts/backup_postgres.sh)"
          printf '%s\n' "$output"
          file="$(printf '%s\n' "$output" | sed -n 's/^backup=//p')"
          test -n "$file" && test -f "$file" && test -f "$file.sha256"
          case "$file" in *.age) ;; *) echo "backup was not encrypted" >&2; exit 1;; esac
          test ! -e "${file%.age}"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - name: Create isolated restore database
        run: psql -h 127.0.0.1 -U signalgate -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE signalgate_restore;"
      - name: Reject occupied pgxtoast lookalike schema in isolated PostgreSQL
        env:
          RESTORE_DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate_restore_collision
        run: |
          psql -h 127.0.0.1 -U signalgate -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE signalgate_restore_collision;"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA pgxtoast_app; CREATE TABLE pgxtoast_app.sentinel (value text NOT NULL); INSERT INTO pgxtoast_app.sentinel VALUES ('preserve');"
          mkdir -p "$RUNNER_TEMP/restore-probe-bin"
          cat > "$RUNNER_TEMP/restore-probe-bin/pg_restore" <<'SH'
          #!/bin/sh
          touch "$SG_RESTORE_CALLED"
          exit 90
          SH
          chmod 700 "$RUNNER_TEMP/restore-probe-bin/pg_restore"
          export SG_RESTORE_CALLED="$RUNNER_TEMP/restore-unexpectedly-called"
          set +e
          output="$(PATH="$RUNNER_TEMP/restore-probe-bin:$PATH" bash scripts/restore_postgres.sh 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq "Restore target is occupied or cannot be verified empty; refusing restore" <<< "$output"
          test ! -e "$SG_RESTORE_CALLED"
          observed="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c "SELECT value FROM pgxtoast_app.sentinel;")"
          test "$observed" = "preserve"
      - name: Restore checked backup
        env:
          RESTORE_DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate_restore
        run: bash scripts/restore_postgres.sh
      - name: Verify restored data
        env:
          RESTORE_DATABASE_URL: postgresql://signalgate:signalgate_ci_password@127.0.0.1:5432/signalgate_restore
        run: |
          value="$(psql "$RESTORE_DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "SELECT value FROM settings WHERE key='restore_probe';")"
          test "$value" = "survived"
          count="$(psql "$RESTORE_DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM settings;")"
          test "$count" -gt 0


  powershell-harness-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse MT5 evidence PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/capture_mt5_compile_evidence.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK"
      - name: Test MT5 compiler evidence gate with offline adverse fixtures
        shell: pwsh
        run: .\scripts\test_mt5_compile_evidence_guard.ps1
