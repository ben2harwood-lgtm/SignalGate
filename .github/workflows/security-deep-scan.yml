name: SignalGate Deep Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalgate-deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem for fixable high/critical vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,misconfig
          cache: "true"

  container-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted image for security scan
        run: docker build --pull -t signalgate-security-scan .
      - name: Verify final image server imports and removed packaging tools
        run: |
          # A dependency consistency check ran in the Docker build before tool removal.
          docker run --rm signalgate-security-scan python -c "import fastapi, httpx, sqlalchemy, uvicorn, pydantic, psycopg2, alembic; print('runtime imports OK')"
          docker run --rm signalgate-security-scan python -c "import importlib.util as u; assert u.find_spec('pip') is None; assert u.find_spec('setuptools') is None; print('packaging tools absent')"
          docker run --rm signalgate-security-scan python -c "import importlib.metadata as m; print('msgpack=', m.version('msgpack'))"
      - name: Capture high/critical finding provenance before the blocking scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: signalgate-security-scan
          format: json
          output: trivy-container-findings.json
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          cache: "true"
      - name: Display restricted package finding origins
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("trivy-container-findings.json").read_text())
          found = 0
          for result in report.get("Results", []):
              for issue in result.get("Vulnerabilities") or []:
                  if issue.get("PkgName", "").lower() not in {"msgpack", "setuptools"}:
                      continue
                  found += 1
                  # Do not publish raw image SBOMs, environment, credentials or secrets.
                  details = {
                      "target": result.get("Target"),
                      "package": issue.get("PkgName"),
                      "package_id": issue.get("PkgID"),
                      "version": issue.get("InstalledVersion"),
                      "fixed": issue.get("FixedVersion"),
                      "severity": issue.get("Severity"),
                      "pkg_path": issue.get("PkgPath"),
                      "layer": (issue.get("Layer") or {}).get("DiffID"),
                  }
                  print(json.dumps(details, sort_keys=True))
          print(f"Tracked package findings: {found}")
          PY
      - name: Scan hosted image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: signalgate-security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          cache: "true"
