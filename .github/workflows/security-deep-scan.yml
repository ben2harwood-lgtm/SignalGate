name: SignalGate Deep Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalgate-deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem for fixable high/critical vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,misconfig
          cache: "true"

  container-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted image for security scan
        run: docker build --pull -t signalgate-security-scan .
      - name: Inspect final Python package state
        run: |
          docker run --rm signalgate-security-scan python -m pip check
          docker run --rm signalgate-security-scan python -c "import importlib.metadata as m; names=['setuptools','wheel','msgpack','jaraco.context']; [print(f'{n}={m.version(n)}') for n in names if any(d.metadata['Name'].lower()==n for d in m.distributions())]"
      - name: Scan hosted image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: signalgate-security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          cache: "true"
